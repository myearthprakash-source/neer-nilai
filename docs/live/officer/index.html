<style>
/* Light only, on every phone: operators read it outdoors in sunlight, and a phone set to dark mode must not change it. */
:root{
  color-scheme: light;
  --bg:#F5F7F8; --surface:#FFFFFF; --ink:#16212B; --muted:#5F6B76; --line:#DCE2E7; --soft:#EEF2F5;
  --accent:#1D6FB4; --accent-ink:#FFFFFF; --accent-soft:#E3EEF8;
  --good:#1C8A5A; --good-bg:#E1F3E9; --bad:#C2432D; --bad-bg:#FBE7E2; --warn:#B8770F; --warn-bg:#FBF0D9;
  --shadow:0 1px 2px rgba(22,33,43,.06),0 8px 24px rgba(22,33,43,.06);
  --sans:"IBM Plex Sans","Noto Sans Tamil",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:960px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;min-width:0}
.brand>div{min-width:0}
.brand small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .drop{flex:none}
.install,.seg{flex:none}
.brand .drop{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--accent);display:inline-block}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px;letter-spacing:0}
.spacer{flex:1}
.install{border:1.5px solid var(--accent);color:var(--accent);background:transparent;border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--bg);gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-weight:500;color:var(--muted);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

.page{max-width:480px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:16px}
.page.wide{max-width:960px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.demo-note{font-size:13px;color:var(--muted);background:var(--soft);border-radius:8px;padding:8px 12px}
.err{color:var(--bad);font-size:14px;margin-top:8px}
.info{color:var(--good);font-size:14px;margin-top:8px}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:0;font-size:14px}
.field{display:flex;flex-direction:column;gap:6px;margin-top:14px}
textarea,input,select{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--surface);font-size:16px}
input.big{font-size:24px;letter-spacing:.08em;padding:14px;font-family:var(--mono)}
textarea{min-height:76px;resize:vertical}
.btn{border:0;border-radius:12px;padding:15px 18px;font-size:18px;font-weight:700;width:100%;background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.yes{background:var(--good-bg);color:var(--good)} .pill.partial{background:var(--warn-bg);color:var(--warn)} .pill.no{background:var(--bad-bg);color:var(--bad)} .pill.silent{background:var(--soft);color:var(--muted)}
.pill.pending{background:var(--soft);color:var(--muted)} .pill.confirmed{background:var(--accent-soft);color:var(--accent)} .pill.flagged{background:var(--bad-bg);color:var(--bad)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1}

/* operator: big, few, pictorial */
.op{gap:14px}
.kind{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.04em;padding:1px 6px;border-radius:5px;border:1px solid var(--line);color:var(--muted);background:var(--surface);vertical-align:2px;white-space:nowrap}
.kind.OHT{border-color:#B9D3EA;color:var(--accent);background:var(--accent-soft)}
.pick{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.pick .label{text-align:center}
.tankgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tankgrid button{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 10px;display:grid;grid-template-columns:26px 1fr 12px;align-items:center;gap:8px;text-align:left;font-weight:600;font-size:15px;line-height:1.2;min-height:56px}
.tankgrid button small{display:block;font-family:var(--mono);font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.04em;margin-top:2px}
.tankgrid svg{width:26px;height:26px;fill:none;stroke:var(--muted);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tankgrid i{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);display:block}
.tankgrid i.yes{background:var(--good);border-color:var(--good)} .tankgrid i.partial{background:var(--warn);border-color:var(--warn)} .tankgrid i.no{background:var(--bad);border-color:var(--bad)}
.tankgrid button.yes{border-color:#BFE3CF} .tankgrid button.partial{border-color:#EED6A6} .tankgrid button.no{border-color:#F0BDB2}
.busy{opacity:.45;pointer-events:none;transition:opacity .15s}
.wa-card{text-align:center;padding:26px 20px 22px}
.wa-card h2{font-size:22px;font-weight:700;margin-top:4px}
.wa-card p{margin:8px 0 0;color:var(--muted);font-size:16px}
.wa-ico{width:76px;height:76px;border-radius:50%;background:#E3F6EA;color:#128C7E;display:grid;place-items:center;margin:0 auto 12px}
.wa-ico svg{width:42px;height:42px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.rv-actions .wa{border:1.5px solid #25D366;color:#0B6B57;background:#E9F8EF;border-radius:10px;padding:8px 14px;font-weight:700;font-size:14px}
.locline{font-size:12px;color:var(--muted);margin-top:4px}
.locline a{color:var(--accent);font-weight:600;text-decoration:none}
.locline.none{color:var(--warn)}
.counts{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.counts .pill{font-size:14px;padding:4px 12px}
.ext{font-size:13px;color:var(--muted);background:var(--soft);border-radius:10px;padding:8px 12px}
.who{display:flex;align-items:center;justify-content:space-between;gap:10px}
.who h2{font-size:24px;font-weight:700}
.who .sub{color:var(--muted);font-size:15px;margin-top:2px}
.who .d{font-weight:700;font-size:15px;text-align:right;white-space:nowrap}
.bigq{font-size:26px;font-weight:700;line-height:1.25;text-align:center;padding:6px 0 2px}
.big3{display:flex;flex-direction:column;gap:12px}
.big3 button{border:0;border-radius:18px;padding:18px 18px;display:flex;align-items:center;gap:16px;text-align:left;color:#fff;font-size:24px;font-weight:700;line-height:1.15;box-shadow:var(--shadow);transition:transform .08s ease}
.big3 button:active{transform:scale(.98)}
.big3 .yes{background:var(--good)} .big3 .partial{background:var(--warn)} .big3 .no{background:var(--bad)}
.big3 .ring{width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:none;font-size:34px}
.big3 small{display:block;font-size:14px;font-weight:500;opacity:.9;margin-top:2px}
.tiles2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tiles2 button{border:2px solid var(--line);background:var(--surface);border-radius:18px;padding:18px 10px 14px;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:17px;font-weight:700;line-height:1.2;text-align:center;min-height:132px;transition:transform .08s ease}
.tiles2 button:active{transform:scale(.97)}
.tiles2 svg{width:52px;height:52px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.back{display:flex;align-items:center;gap:8px;border:0;background:none;color:var(--muted);font-weight:600;font-size:16px;padding:4px 0}
.done{text-align:center;padding:26px 18px 22px}
.done .big{width:104px;height:104px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;font-size:56px;font-weight:700;color:#fff}
.done.yes .big{background:var(--good)} .done.partial .big{background:var(--warn)} .done.no .big{background:var(--bad)} .done.mixed .big{background:var(--accent)}
.done h2{font-size:24px}
.done p{margin:6px 0 0;color:var(--muted);font-size:16px}
.done .what{margin-top:12px;display:inline-flex;align-items:center;gap:10px;background:var(--soft);border-radius:999px;padding:8px 16px;font-weight:600}
.done .what svg{width:24px;height:24px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.voice{margin-top:18px;display:flex;flex-direction:column;align-items:center;gap:8px}
.voice button{border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:14px 22px;font-size:18px;font-weight:700;display:flex;align-items:center;gap:10px}
.voice button.rec{background:var(--bad);border-color:var(--bad);color:#fff;animation:pulse 1s infinite}
.voice .hint{font-size:13px;color:var(--muted)}
.voice audio{width:100%;max-width:320px;margin-top:4px}
@keyframes pulse{50%{opacity:.7}}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.strip div{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.strip i{display:block;width:100%;height:12px;border-radius:4px;background:var(--line)}
.strip i.yes{background:var(--good)} .strip i.partial{background:var(--warn)} .strip i.no{background:var(--bad)}
.small-links{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}

/* review + officer */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head h2{font-size:24px;font-weight:700}
.head .sub{color:var(--muted);font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:520px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;border-top:4px solid var(--line)}
.tile .n{font-size:34px;font-weight:600;line-height:1;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tile .t{font-size:13px;color:var(--muted);margin-top:6px}
.tile.yes{border-top-color:var(--good)} .tile.partial{border-top-color:var(--warn)} .tile.no{border-top-color:var(--bad)} .tile.silent{border-top-color:var(--muted)}
.bar{height:8px;border-radius:4px;overflow:hidden;display:flex;background:var(--line)}
.bar i{display:block;height:100%}
.bar .y{background:var(--good)} .bar .p{background:var(--warn)} .bar .n{background:var(--bad)} .bar .s{background:var(--muted)}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
.section-h h3{font-size:16px;font-weight:700}
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:grid;grid-template-columns:4px 1fr auto;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px 0;overflow:hidden}
.alert .stripe{background:var(--bad);border-radius:0 2px 2px 0}
.alert.partial .stripe{background:var(--warn)}
.alert.silent .stripe{background:var(--muted)}
.alert b{display:block;font-weight:600}
.alert .meta{color:var(--muted);font-size:13px}
.alert .cm{font-size:14px;margin-top:4px}
.alert .time{font-size:13px;color:var(--muted);white-space:nowrap;padding-right:14px}
.diagline{font-size:12px;color:var(--muted);margin-top:4px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.filters button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:500}
.filters button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.tbl-wrap{overflow-x:auto}

td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.time{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted)}

.grp td{padding:8px 10px}
.settings{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}

.switch{width:44px;height:26px;border-radius:999px;border:0;background:var(--line);position:relative;flex:none}

.two{display:grid;grid-template-columns:1fr;gap:16px}

    : v === "partial" ? { source_ok: "no", pump_ok: "yes", glr_filled: "no", problem: "source" } : {}, 8, 30, ["confirmed", ""])));

  const at2 = (lat, lng, acc) => ({ lat, lng, acc });
  // Today: Sivakumar and Gopal reported; Suresh reported one of three; Kantharaj not yet.
  R(1, today, "yes", at2(11.4903, 76.6012, 9), 7, 40, ["confirmed", ""]); R(2, today, "yes", at2(11.4903, 76.6012, 9), 7, 40, ["confirmed", ""]);
  R(3, today, "yes", at2(11.4861, 76.6107, 14), 8, 5); R(4, today, "yes", at2(11.4861, 76.6107, 14), 8, 5);
  R(5, today, "partial", { source_ok: "no", pump_ok: "yes", glr_filled: "no", problem: "source", remarks: "Main road tank half; source low after dry week", ...at2(11.4861, 76.6107, 14) }, 8, 5, ["confirmed", ""]);
  R(6, today, "no", { problem: "pump", ...at2(11.4952, 76.5934, 22) }, 8, 20);
  // Masinagudi: Sidick Shameer's 12 tanks (4 GLR + 8 OHT), last 6 days; Moyar Road OHT ran short twice.
  for (let i = 0; i < 6; i++) for (let g = 14; g <= 25; g++) {
    const short = g === 22 && (i === 1 || i === 4);
    R(g, dayOffset(-6 + i), short ? "partial" : "yes", short ? { source_ok: "yes", pump_ok: "yes", glr_filled: "no", problem: "glr", remarks: "OHT filled to half; GLR level low" } : {}, 6, 45, ["confirmed", ""]);
  }
  // Today: Ramesh all fine; Manigandan's Kel Boothanatham OHT has no water (motor); Ragavendran short at Undi Moyar.

  R(12, today, "yes", at2(11.5791, 76.6236, 11), 6, 50, ["confirmed", ""]); R(13, today, "yes", at2(11.5791, 76.6236, 11), 6, 50, ["confirmed", ""]);
  [26, 27, 28].forEach((g) => R(g, today, "yes", at2(11.5598, 76.6312, 8), 7, 15)); R(29, today, "no", { problem: "pump", ...at2(11.5598, 76.6312, 8) }, 7, 15);
  R(30, today, "yes", {}, 7, 35); R(31, today, "partial", { problem: "pipe" }, 7, 35);
  store.set(RK, rows);
}

// Operator as the app keeps it. No PIN is kept: once signed in, this phone's secret is the key.
const opFromRows = (rows, phone) => { const r0 = rows[0]; return { id: r0.operator_id, name: r0.operator_name, ta: r0.operator_name_ta, phone, pin: null,
  glrs: rows.map((r) => ({ id: r.glr_id, kind: r.kind ?? "GLR", code: r.code, name: r.glr, ta: r.glr_ta, location: r.location, capacity: r.capacity, hab: r.habitation, habTa: r.habitation_ta,

const demoOp = (o) => ({ id: o.id, name: o.name, ta: o.ta, phone: o.phone, pin: null, glrs: DEMO.glrs.filter((g) => g.op === o.id).map(glrInfo) });
const data = {
  // Number + last 4 digits (or a personal PIN), on any phone. Signs this phone in.
  async login(phone, pin) {
    phone = digits10(phone);
    if (LIVE) {
      const { data: rows, error } = await sb.rpc("operator_login", { p_phone: phone, p_pin: pin, p_device: deviceId() });
      if (error) return { error: navigator.onLine ? "badLogin" : "offline" };
      const r0 = rows?.[0];
      if (!r0) return { error: "noTanks" };   // signed in, but no tank is theirs right now
      if (r0.err) return { error: AUTH_KEY[r0.err] ?? "badLogin" };
      return opFromRows(rows, phone);
    }
    const o = DEMO.operators.find((x) => x.phone === phone);
    const pins = store.get("pins", {});
    if (!o) return { error: "notRegOp" };
    if (pin !== (pins[o.id] ?? phone.slice(-4))) return { error: "wrongDigits" };   // last 4 digits, unless a personal PIN was set
    const op = demoOp(o);
    return op.glrs.length ? op : { error: "noTanks" };
  },
  // The signed-in operator as the server knows them now (the panchayat officer may have changed their name, number or
  // tanks). { error } = signed out, removed or no tanks; null = could not check (offline), keep what we have.
  async refreshOp() {
    if (LIVE) {
      const { data: rows, error } = await sb.rpc("operator_login", { p_phone: state.op.phone, p_pin: null, p_device: deviceId() });
      if (error) return null;
      const r0 = rows?.[0];
      if (!r0) return { error: "noTanks" };
      if (r0.err) return { error: r0.err === "unknown" ? "notRegOp" : r0.err === "locked" ? "pinLocked" : "signInAgain" };
      return opFromRows(rows, state.op.phone);
    }
    const o = DEMO.operators.find((x) => x.id === state.op.id);
    const op = o && demoOp(o);
    return !op ? { error: "notRegOp" } : op.phone !== state.op.phone ? { error: "signInAgain" } : op.glrs.length ? op : { error: "noTanks" };
  },
  // Add an operator or change one ({ id | null, panchayat_id, name, ta, phone, glrIds }); remove one.
  async saveOperator(f) {
    const phone = digits10(f.phone), name = f.name.trim(), ta = (f.ta ?? "").trim();
    if (!name) throw new Error(t("nameRequired"));
    if (!/^[6-9]\d{9}$/.test(phone)) throw new Error(t("badPhone"));
    if (!f.glrIds.length) throw new Error(t("pickTank"));
    if (LIVE) {
      const { data: id, error } = await sb.rpc("save_operator", { p_id: f.id ?? null, p_panchayat_id: f.panchayat_id, p_name: name, p_name_ta: ta || null, p_phone: phone, p_glr_ids: f.glrIds });
      if (error) throw new Error(error.code === "23505" ? t("phoneInUse") : error.code === "42501" ? t("notAllowedOp") : error.message);
      return id;
    }
    if (DEMO.operators.some((o) => o.phone === phone && o.id !== f.id)) throw new Error(t("phoneInUse"));
    let o = DEMO.operators.find((x) => x.id === f.id);
    if (!o) { o = { id: Math.max(0, ...DEMO.operators.map((x) => x.id)) + 1, p: f.panchayat_id }; DEMO.operators.push(o); }
    Object.assign(o, { name, ta, phone });
    DEMO.glrs.forEach((g) => { if (f.glrIds.includes(g.id)) g.op = o.id; else if (g.op === o.id) g.op = null; });
    saveDemoOps();
    return o.id;
  },
  async removeOperator(id) {
    if (LIVE) { const { error } = await sb.rpc("remove_operator", { p_id: id }); if (error) throw error; return; }
    DEMO.operators = DEMO.operators.filter((o) => o.id !== id);
    DEMO.glrs.forEach((g) => { if (g.op === id) g.op = null; });
    saveDemoOps();
  },
  // The usual way in: the one-time link the panchayat officer sent on WhatsApp. Nothing to type.
  async join(code) {
    if (LIVE) {
      const { data: rows, error } = await sb.rpc("operator_join", { p_code: code, p_device: deviceId() });
      if (error) return { error: navigator.onLine ? "linkBad" : "offline" };
      const r0 = rows?.[0];
      if (!r0 || r0.err) return { error: "linkBad" };
      return opFromRows(rows, r0.operator_phone);
    }
    const o = DEMO.operators.find((x) => `demo-${x.id}` === code);
    return o ? demoOp(o) : { error: "linkBad" };
  },
  // Staff a senior officer looks after: add, change, remove, sign out everywhere.
  async staffList() {

      const { data: rows, error } = await sb.from("v_staff").select("*").order("role").order("name"); if (error) throw error;

      .map((s) => { const pl = demoPlace(s); return { phone: s.phone, name: s.name, ta: s.ta, role: s.role, devices: dev[s.phone] ?? 1, placeId: pl?.id, place: pl?.name, placeTa: pl?.ta }; });

// Operator functions answer an unknown number, a wrong PIN or a lockout with a code instead of an error
// ("device" only comes from an older database that still allowed one phone per operator).
const AUTH_KEY = { unknown: "notRegOp", bad: "wrongDigits", locked: "pinLocked", device: "deviceLocked" };
// Mobile number as typed, pasted or autofilled ("+91 98765 43210", "098765-43210") → its 10 digits.
const digits10 = (s) => String(s ?? "").replace(/\D/g, "").slice(-10);
// Demo staff: the built-in list plus anyone added on this phone.
const demoStaff = () => store.get("staff", DEMO.staff);

const authError = (code) => Object.assign(new Error(t(AUTH_KEY[code] ?? "badLogin")), { authKey: AUTH_KEY[code] ?? "badLogin" });
// This phone's secret: 32 random bytes made once on the phone. Once linked, it is the operator's key (the server keeps only a hash).
function deviceId() {
  let id = store.get("device", null);
  if (!id || id.length < 40) {
    const b = new Uint8Array(32); crypto.getRandomValues(b);
    id = btoa(String.fromCharCode(...b)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    store.set("device", id);
  }
  return id;
}
// Where the phone is when the operator answers (anti-cheat stamp). Never makes the operator wait long:
// asked once right after sign-in (so the "allow location?" question comes then, not mid-report), and a report waits
// at most 4 s, then uses a fix from the last 10 minutes or goes without one (the officer sees "No location recorded").
let lastFix = null;
function here(maxWait = 8000) {
  return new Promise((res) => {
    if (!navigator.geolocation) return res(null);
    const timer = setTimeout(() => res(null), maxWait);
    navigator.geolocation.getCurrentPosition(
      (p) => { lastFix = { lat: p.coords.latitude, lng: p.coords.longitude, acc: Math.round(p.coords.accuracy), t: Date.now() }; clearTimeout(timer); res(lastFix); },
      () => { clearTimeout(timer); res(null); },
      { enableHighAccuracy: true, timeout: maxWait, maximumAge: 300000 });
  });
}
async function stamp() {
  const v = (await here(4000)) ?? (lastFix && Date.now() - lastFix.t < 600000 ? lastFix : null);
  return v && { lat: v.lat, lng: v.lng, acc: v.acc };
}
function queue(ids, d) { const q = store.get("queue", []); q.push({ ids, d, at: nowIso() }); store.set("queue", q); }
async function flushQueue() {
  const q = store.get("queue", []); if (!q.length || !LIVE || !navigator.onLine || !state.op) return;
  const rest = [];
  for (const item of q) { try { await data.submit(item.ids ? item.ids.map((id) => ({ id })) : [item.glr], item.d.status, item.d.problem, item.d.loc); } catch { rest.push(item); } }
  store.set("queue", rest);
  if (rest.length < q.length) toast(t("saved"));
}

async function save(glrs, status, problem) {
  if (state.busy || !glrs.length) return;
  state.busy = true; state.error = "";
  // Visible at once on a slow network: buttons dim and the question says "Saving…" until the server answers.
  app.querySelectorAll(".big3, .tiles2, .tankgrid").forEach((el) => el.classList.add("busy"));
  const q = app.querySelector(".bigq"); if (q) q.textContent = t("saving");
  try {
    const loc = await stamp();   // a refusal or no fix still saves the report
    const res = await data.submit(glrs, status, problem, loc);
    state.editing = false; state.step = "home"; state.pick = null;
    toast(res.queued ? t("offline") : t("saved"));
  } catch (e) {
    // Signed out by the panchayat officer, number removed or locked since sign-in: back to the sign-in screen with the reason.
    if (e.authKey) { state.op = null; store.set("op", null); state.error = e.authKey === "wrongDigits" ? "signInAgain" : e.authKey; }
    else { state.error = e.message || String(e); syncOp(); }   // e.g. a tank moved to another operator meanwhile
  }
  state.busy = false; render();
}
// Each time the app opens: pick up a changed name, number or tank list; a removed or signed-out operator goes back to sign-in.
async function syncOp() {
  if (!state.op) return;
  const res = await data.refreshOp().catch(() => null);
  if (!res || !state.op) return;
  if (res.error) { state.op = null; store.set("op", null); state.error = res.error; return render(); }
  if (JSON.stringify(res) !== JSON.stringify(state.op)) { state.op = res; store.set("op", res); render(); }
}

let rec = null, chunks = [], recTimer = null;
async function startVoice(glrs) {
  if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) { toast(t("voiceNo")); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    rec = new MediaRecorder(stream); chunks = [];
    rec.ondataavailable = (e) => chunks.push(e.data);
    rec.onstop = async () => {
      stream.getTracks().forEach((tr) => tr.stop()); clearTimeout(recTimer); state.recording = false;
      try { await data.attachVoice(glrs, new Blob(chunks, { type: rec.mimeType || "audio/webm" })); toast(t("voiceSaved")); } catch (e) { toast(e.message); }
      render();
    };
    rec.start(); state.recording = true; render();
    recTimer = setTimeout(stopVoice, 20000);
  } catch { toast(t("voiceNo")); }
}
function stopVoice() { if (rec && rec.state === "recording") rec.stop(); }

function bindPlay(list) {
  app.querySelectorAll("[data-play]").forEach((b) => b.addEventListener("click", async () => {
    const i = +b.dataset.play, url = await data.voiceUrl(list[i]); if (!url) return;
    document.getElementById("audio-" + i).innerHTML = `<audio controls autoplay src="${esc(url)}" style="display:block;width:100%;max-width:320px;margin-top:6px"></audio>`;
  }));
}

// ---------------------------------------------------------------- panchayat review: confirm/flag, diagnostics, record on behalf, operators
async function renderReview() {
  let rows, ops, ext;
  const seq = renderSeq;
  try { rows = await data.today(); ops = await data.operators(); ext = await data.external(); } catch (e) { if (!stale(seq)) app.innerHTML = `<div class="page"><div class="card err">${esc(e.message)}</div></div>`; return; }
  if (stale(seq)) return;
  const pid = state.officer.panchayat_id;
  const mine = LIVE ? rows : rows.filter((r) => r.panchayat_id === pid);
  const myOps = LIVE ? ops : ops.filter((o) => o.panchayat_id === pid);
  const myExt = ext.filter((h) => mine.some((r) => r.panchayat_id === h.panchayat_id));
  const pname = mine[0] ? nm2(mine[0].panchayat, mine[0].panchayatTa) : "";
  const rank = { no: 0, partial: 1, not_reported: 2, yes: 3 };
  const pend = (r) => r.review_status === "pending" ? 0 : 1;
  const list = [...mine].sort((a, b) => rank[a.status] - rank[b.status] || pend(a) - pend(b) || String(a.code).localeCompare(String(b.code)));
  const pending = mine.filter((r) => r.status !== "not_reported" && r.review_status === "pending").length;
  const draft = (r) => state.rvDraft[r.id] ?? (state.rvDraft[r.id] = { status: null, problem: r.problem, source_ok: r.source_ok, pump_ok: r.pump_ok, glr_filled: r.glr_filled, remarks: r.remarks ?? "" });
  const appUrl = location.origin + location.pathname.replace(/review\/?(index\.html)?$/, "");

  // Silent tanks are grouped per operator: one call to the operator usually settles all of them ("all came").
  const silentGroups = new Map();
  list.forEach((r, i) => { if (r.status === "not_reported") { const k = String(r.operator_id ?? "none"); if (!silentGroups.has(k)) silentGroups.set(k, []); silentGroups.get(k).push(i); } });
  const groupCard = (k, idx) => {
    const r0 = list[idx[0]], tanks = idx.map((i) => list[i]);
    if (idx.length === 1 || state.rvOpen[k]) return idx.map((i) => item(list[i], i)).join("");
    return `<div class="rv-item">
      <div class="rv-top"><div><b>${esc(nm2(r0.operator, r0.operatorTa) || "—")}</b> <span class="sub">· ${esc(r0.operator_phone ?? "")}</span>
          <div class="sub">${idx.length} ${esc(t("tanks"))} (${esc(kindCount(tanks))}) · ${esc(t("silentNote"))}</div></div>${statusPill("not_reported")}</div>
      <div class="rv-body" style="color:var(--muted)">${tanks.map((r) => esc(nm(r))).join(" · ")}</div>
      <div class="rv-actions">
        ${r0.operator_phone ? `<a class="call" href="tel:+91${esc(r0.operator_phone)}">${esc(t("call"))}</a>` : ""}
        <button class="st-yes" data-rvall="${esc(k)}">${esc(t("allNormal"))}</button>
        <button data-rvopen="${esc(k)}">${esc(t("oneByOne"))}</button>
      </div>
    </div>`;
  };
  const item = (r, i) => {
      const d = draft(r);
      const isIssue = r.status === "partial" || r.status === "no";
      const silent = r.status === "not_reported";
      const draftIssue = d.status === "partial" || d.status === "no";
      return `<div class="rv-item">
        <div class="rv-top"><div>${kindTag(r.kind)} <b>${esc(nm(r))}</b> <span class="sub">· ${esc(nm2(r.hab, r.habTa))} · ${esc(fmtCap(r.capacity))}</span>
            <div class="sub">${esc(nm2(r.operator, r.operatorTa))} · ${esc(r.operator_phone ?? "")}${r.at ? ` · ${esc(fmtTime(r.at))}` : ""}${r.entered_by === "reviewer" ? ` · ${esc(t("byReviewer"))}` : ""}</div>${locLine(r)}</div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">${statusPill(r.status)}${!silent ? reviewPill(r.review_status) : ""}</div></div>
        ${silent ? `
          <div class="rv-body" style="color:var(--muted)">${esc(t("silentNote"))}</div>
          <div class="rv-body" style="margin-top:8px"><b>${esc(t("recordFor"))}</b></div>
          <div class="rv-actions">${["yes", "partial", "no"].map((s) => `<button class="st-${s}" data-rf="${i}" data-s="${s}" style="${d.status === s ? "background:var(--soft)" : ""}">${esc(statusLabel(s))}</button>`).join("")}</div>
          ${draftIssue ? `<div class="rv-diag"><div class="chips">${PROBLEMS.map((p) => `<button data-rfp="${i}" data-p="${p.code}" aria-pressed="${d.problem === p.code}">${esc(state.lang === "ta" ? p.ta : p.en)}</button>`).join("")}</div>
            <input id="rfnote-${i}" placeholder="${esc(t("notePh"))}" value="${esc(d.remarks)}"></div>` : ""}
          ${d.status ? `<div class="rv-actions"><button class="ok" data-rfsave="${i}" ${draftIssue && !d.problem ? "disabled" : ""}>${esc(t("confirm"))}</button></div>` : ""}`
        : `
          ${isIssue ? `<div class="rv-body"><b>${esc(problemLabel(r.problem))}</b></div>${voiceBtn(r, i)}` : (r.remarks ? `<div class="rv-body">${esc(r.remarks)}</div>` : "")}
          ${r.review_note ? `<div class="rv-body" style="color:var(--muted)">${esc(t("review"))}: ${esc(r.review_note)}</div>` : ""}
          ${isIssue ? `<div class="rv-diag">
            ${DIAG.map(([k, q]) => `<div><div class="q">${esc(t(q))}</div><div class="diag">${["yes", "no", "unknown"].map((v) => `<button data-rvd="${i}" data-k="${k}" data-v="${v}" aria-pressed="${d[k] === v}">${esc(dLabel(v))}</button>`).join("")}</div></div>`).join("")}
            <div><div class="q">${esc(t("problemCol"))}</div><div class="chips">${PROBLEMS.map((p) => `<button data-rvp="${i}" data-p="${p.code}" aria-pressed="${d.problem === p.code}">${esc(state.lang === "ta" ? p.ta : p.en)}</button>`).join("")}</div></div>
          </div>` : ""}
          <div class="rv-actions">
            <input id="note-${i}" placeholder="${esc(t("notePh"))}" value="${esc(d.remarks)}">
            <button class="ok" data-rv="${i}" data-s="confirmed">${esc(t("confirm"))}</button>
            <button class="flag" data-rv="${i}" data-s="flagged">${esc(t("flag"))}</button>
          </div>`}
      </div>`; };
  const ordered = [
    ...list.map((r, i) => r.status === "no" || r.status === "partial" ? item(r, i) : ""),
    ...[...silentGroups].map(([k, idx]) => groupCard(k, idx)),
    ...list.map((r, i) => r.status === "yes" ? item(r, i) : ""),
  ].join("");

  app.innerHTML = `<div class="page wide">
    ${LIVE ? "" : `<div class="demo-note">${esc(t("demoBanner"))}</div>`}
    <div class="head"><div><h2>${esc(pname)} · ${esc(t("reviewTitle"))}</h2><div class="sub">${esc(fmtDate(istToday()))} · ${mine.length} ${esc(t("tanks"))} (${esc(kindCount(mine))}) · ${pending} ${esc(t("pending").toLowerCase())}</div></div>${signOutBtn()}</div>
    <p style="margin:0;color:var(--muted);font-size:14px">${esc(t("reviewHint"))}</p>
    ${extLine(myExt)}
    <div class="rv">${ordered || `<div class="card" style="color:var(--muted)">${esc(t("nothingToReview"))}</div>`}</div>

    <div class="section-h" style="margin-top:8px"><h3>${esc(t("operators"))} <span class="label">${myOps.length}</span></h3>
      ${state.opForm ? "" : `<button class="link" id="addOp">${esc(t("addOperator"))}</button>`}</div>
    <p style="margin:-4px 0 0;color:var(--muted);font-size:14px">${esc(t("opHint"))}</p>
    ${opForm(mine)}
    <div class="rv">${myOps.map((o) => `<div class="rv-item">
        <div class="rv-top"><div><b>${esc(nm(o))}</b> <span class="sub">· ${esc(o.phone)}</span><div class="sub">${o.glrCount} ${esc(t("tanks"))} · ${esc(o.phones ? t("phonesIn").replace("{n}", o.phones) : t("noDevice"))}${o.lastLink ? ` · ${esc(t("linkSent"))} ${esc(fmtDate(String(o.lastLink).slice(0, 10)))}` : ""}</div></div></div>
        ${state.newPins[o.id] ? `<div class="pinbox">${esc(t("pinIs"))}: <b>${esc(state.newPins[o.id])}</b><br>${esc(t("tellOp"))}</div>` : ""}
        ${state.justAdded === o.id ? `<div class="pinbox">${esc(t("opSaved"))}</div>` : ""}
        <div class="rv-actions">
          <button class="wa" data-walink="${o.id}">${esc(t("waLink"))}</button>
          <button data-resetdev="${o.id}" ${o.phones ? "" : "disabled"}>${esc(t("resetDevice"))}</button>
          <button data-setpin="${o.id}">${esc(t("setPin"))}</button>
          <button data-editop="${o.id}">${esc(t("editPerson"))}</button>
          <button class="flag" data-removeop="${o.id}">${esc(t("removePerson"))}</button>
        </div>
      </div>`).join("")}</div>
    ${LIVE ? "" : `<div style="text-align:center"><button class="link" id="resetDemo">${esc(t("reset"))}</button></div>`}
  </div>`;
  bindSignOut(); bindReset(); bindPlay(list);
  const keepNotes = () => app.querySelectorAll("input[id^='note-'],input[id^='rfnote-']").forEach((inp) => { const i = +inp.id.split("-")[1]; draft(list[i]).remarks = inp.value; });
  app.querySelectorAll("[data-rvd]").forEach((b) => b.addEventListener("click", () => { keepNotes(); const d = draft(list[+b.dataset.rvd]); d[b.dataset.k] = d[b.dataset.k] === b.dataset.v ? null : b.dataset.v; render(); }));
  app.querySelectorAll("[data-rvp]").forEach((b) => b.addEventListener("click", () => { keepNotes(); draft(list[+b.dataset.rvp]).problem = b.dataset.p; render(); }));
  app.querySelectorAll("[data-rv]").forEach((b) => b.addEventListener("click", async () => {
    keepNotes(); const r = list[+b.dataset.rv], d = draft(r);
    try { await data.review(r, { review_status: b.dataset.s, remarks: d.remarks, source_ok: d.source_ok, pump_ok: d.pump_ok, glr_filled: d.glr_filled, problem: d.problem }); toast(t(b.dataset.s)); delete state.rvDraft[r.id]; } catch (e) { toast(e.message); }
    render();
  }));
  app.querySelectorAll("[data-rf]").forEach((b) => b.addEventListener("click", () => { keepNotes(); draft(list[+b.dataset.rf]).status = b.dataset.s; render(); }));
  app.querySelectorAll("[data-rfp]").forEach((b) => b.addEventListener("click", () => { keepNotes(); draft(list[+b.dataset.rfp]).problem = b.dataset.p; render(); }));
  app.querySelectorAll("[data-rfsave]").forEach((b) => b.addEventListener("click", async () => {
    keepNotes(); const r = list[+b.dataset.rfsave], d = draft(r);
    try { await data.recordFor(r, d.status, d.problem, d.remarks); toast(t("saved")); delete state.rvDraft[r.id]; } catch (e) { toast(e.message); }
    render();
  }));
  app.querySelectorAll("[data-rvopen]").forEach((b) => b.addEventListener("click", () => { state.rvOpen[b.dataset.rvopen] = true; render(); }));
  app.querySelectorAll("[data-rvall]").forEach((b) => b.addEventListener("click", async () => {
    b.disabled = true;
    try { for (const i of silentGroups.get(b.dataset.rvall) ?? []) await data.recordFor(list[i], "yes", null, ""); toast(t("saved")); } catch (e) { toast(e.message); }
    render();
  }));
  // A fresh sign-in link for this operator (works on any phone for 30 days), sent from the officer's own WhatsApp to the operator's registered number.
  app.querySelectorAll("[data-walink]").forEach((b) => b.addEventListener("click", async () => {
    const o = myOps.find((x) => x.id === +b.dataset.walink); if (!o) return;
    const w = window.open("about:blank", "_blank");   // opened inside the tap so the browser allows it; pointed at WhatsApp below
    try {
      const code = await data.createLink(o.id);
      const wa = `https://wa.me/91${o.phone}?text=${encodeURIComponent(t("waText").replace("{url}", `${appUrl}#join=${encodeURIComponent(code)}`))}`;
      if (w) w.location.href = wa; else location.href = wa;
      toast(t("linkSent"));
    } catch (e) { w?.close(); toast(e.message); }
    render();
  }));
  app.querySelectorAll("[data-setpin]").forEach((b) => b.addEventListener("click", async () => {
    const id = +b.dataset.setpin, pin = String(Math.floor(1000 + Math.random() * 9000));
    try { await data.setPin(id, pin); state.newPins[id] = pin; } catch (e) { toast(e.message); }
    render();
  }));
  app.querySelectorAll("[data-resetdev]").forEach((b) => b.addEventListener("click", async () => {
    try { await data.resetDevice(+b.dataset.resetdev); toast(t("deviceReset")); } catch (e) { toast(e.message); }
    render();
  }));
  bindOpForm();
  document.getElementById("addOp")?.addEventListener("click", () => {
    state.opForm = { id: null, panchayat_id: LIVE ? mine[0]?.panchayat_id : pid, name: "", ta: "", phone: "", glrIds: [], scroll: true }; render();
  });
  app.querySelectorAll("[data-editop]").forEach((b) => b.addEventListener("click", () => {
    const o = myOps.find((x) => x.id === +b.dataset.editop);
    state.opForm = { id: o.id, panchayat_id: o.panchayat_id, name: o.name, ta: o.ta ?? "", phone: o.phone, glrIds: mine.filter((r) => r.operator_id === o.id).map((r) => r.id), scroll: true }; render();
  }));
  app.querySelectorAll("[data-removeop]").forEach((b) => b.addEventListener("click", async () => {
    const o = myOps.find((x) => x.id === +b.dataset.removeop);
    if (!confirm(t("confirmRemoveOp").replace("{name}", nm(o)))) return;
    try { await data.removeOperator(o.id); toast(t("staffRemoved")); } catch (e) { toast(e.message); }
    render();
  }));
}

// ---------------------------------------------------------------- operators: add / change (panchayat officer, or the block / district above)
// Name, number and the tanks they run, ticked from the panchayat's tank list. A tank ticked here moves from its
// current operator (shown beside it), so a hand-over is one save.
function opForm(rows) {
  const f = state.opForm; if (!f) return "";
  const pans = [...new Map(rows.map((r) => [r.panchayat_id, { id: r.panchayat_id, name: r.panchayat, ta: r.panchayatTa }])).values()];
  if (!pans.some((p) => p.id === f.panchayat_id)) f.panchayat_id = pans[0]?.id;
  const tanks = rows.filter((r) => r.panchayat_id === f.panchayat_id).sort((a, b) => String(a.code).localeCompare(String(b.code)));
  const who = (r) => r.operator_id && r.operator_id !== f.id ? ` · ${t("nowWith")} ${nm2(r.operator, r.operatorTa)}` : !r.operator_id ? ` · ${t("noOperator")}` : "";
  return `<div class="card op-form">
    <div class="field" style="margin-top:0"><label class="label" for="ofName">${esc(t("name"))}</label><input id="ofName" autocomplete="off" value="${esc(f.name)}"></div>
    <div class="field"><label class="label" for="ofTa">${esc(t("nameTa"))}</label><input id="ofTa" lang="ta" autocomplete="off" value="${esc(f.ta)}"></div>
    <div class="field"><label class="label" for="ofPhone">${esc(t("mobile"))}</label><input id="ofPhone" inputmode="tel" autocomplete="off" placeholder="9876543210" value="${esc(f.phone)}"></div>
    ${pans.length > 1 && !f.id ? `<div class="field"><label class="label" for="ofPan">${esc(t("panchayat"))}</label><select id="ofPan">${pans.map((p) => `<option value="${p.id}" ${p.id === f.panchayat_id ? "selected" : ""}>${esc(nm(p))}</option>`).join("")}</select></div>` : ""}
    <div class="field"><div class="label">${esc(t("tanksRun"))}</div>
      <div class="tankpick">${tanks.map((r) => `<label><input type="checkbox" value="${r.id}" ${f.glrIds.includes(r.id) ? "checked" : ""}>
        <span>${kindTag(r.kind)} <b>${esc(nm(r))}</b> <span class="sub">· ${esc(nm2(r.hab, r.habTa))}${esc(who(r))}</span></span></label>`).join("")}</div></div>
    ${f.error ? `<div class="err">${esc(f.error)}</div>` : ""}
    <div class="rv-actions"><button class="ok" id="ofSave">${esc(t("save"))}</button><button id="ofCancel">${esc(t("cancel"))}</button></div>
  </div>`;
}
function bindOpForm() {
  const f = state.opForm; if (!f) return;
  const $ = (id) => document.getElementById(id);
  if (f.scroll) { f.scroll = false; app.querySelector(".op-form")?.scrollIntoView({ block: "start" }); }
  const keep = () => { f.name = $("ofName").value; f.ta = $("ofTa").value; f.phone = $("ofPhone").value; f.glrIds = [...app.querySelectorAll(".tankpick input:checked")].map((c) => +c.value); };
  $("ofPan")?.addEventListener("change", () => { keep(); f.panchayat_id = +$("ofPan").value; f.glrIds = []; render(); });
  $("ofCancel").addEventListener("click", () => { state.opForm = null; render(); });
  $("ofSave").addEventListener("click", async () => {
    keep(); f.error = ""; $("ofSave").disabled = true; $("ofSave").textContent = t("saving");
    try { const id = await data.saveOperator(f); state.opForm = null; state.justAdded = f.id ? null : id; toast(t("saved")); } catch (e) { f.error = e.message; }
    render();
  });
}

// ---------------------------------------------------------------- staff: add / change a person (district and block officers)
// The role list and each role's places come from the server (staff_places), so nobody can pick outside their area.
const ROLE_ORDER = ["district", "block", "panchayat"];
const placeOpts = (places, role, sel) => places.filter((p) => p.role === role)
  .map((p) => `<option value="${p.id}" ${p.id === sel ? "selected" : ""}>${esc(nm(p))}${p.parent ? ` · ${esc(nm2(p.parent, p.parentTa))}` : ""}</option>`).join("");
function staffForm(places) {
  const f = state.staffForm; if (!f) return "";
  const roles = ROLE_ORDER.filter((r) => places.some((p) => p.role === r));
  if (!roles.includes(f.role)) f.role = roles.includes("panchayat") ? "panchayat" : roles[0];
  if (!places.some((p) => p.role === f.role && p.id === f.place)) f.place = places.find((p) => p.role === f.role)?.id;
  return `<div class="card staff-form">
    <div class="field" style="margin-top:0"><label class="label" for="sfName">${esc(t("name"))}</label><input id="sfName" autocomplete="off" value="${esc(f.name)}"></div>
    <div class="field"><label class="label" for="sfPhone">${esc(t("mobile"))}</label><input id="sfPhone" inputmode="tel" autocomplete="off" placeholder="9876543210" value="${esc(f.phone)}" ${f.edit ? "readonly" : ""}></div>
    <div class="field"><label class="label" for="sfRole">${esc(t("roleL"))}</label><select id="sfRole">${roles.map((r) => `<option value="${r}" ${r === f.role ? "selected" : ""}>${esc(t("role_" + r))}</option>`).join("")}</select></div>
    <div class="field"><label class="label" for="sfPlace">${esc(t("placeL"))}</label><select id="sfPlace">${placeOpts(places, f.role, f.place)}</select></div>
    ${f.error ? `<div class="err">${esc(f.error)}</div>` : ""}
    <div class="rv-actions"><button class="ok" id="sfSave">${esc(t("save"))}</button><button id="sfCancel">${esc(t("cancel"))}</button></div>
  </div>`;
}
function bindStaffForm(places) {
  const f = state.staffForm; if (!f) return;
  const $ = (id) => document.getElementById(id);
  const keep = () => { f.name = $("sfName").value; f.phone = $("sfPhone").value; f.place = +$("sfPlace").value; };
  $("sfRole").addEventListener("change", () => { f.role = $("sfRole").value; f.place = places.find((p) => p.role === f.role)?.id; $("sfPlace").innerHTML = placeOpts(places, f.role, f.place); });
  $("sfCancel").addEventListener("click", () => { state.staffForm = null; render(); });
  $("sfSave").addEventListener("click", async () => {
    keep(); f.error = ""; $("sfSave").disabled = true; $("sfSave").textContent = t("saving");
    try { await data.saveStaff(f.phone, f.name, f.role, f.place); state.staffForm = null; toast(t("staffSaved")); } catch (e) { f.error = e.message; }
    render();
  });
}

// ---------------------------------------------------------------- block / district officer
async function renderOfficer() {
  let rows, ext, staff, places;
  const seq = renderSeq;
  try { rows = await data.today(); ext = await data.external(); staff = await data.staffList().catch(() => []); places = await data.staffPlaces().catch(() => []); } catch (e) { if (!stale(seq)) app.innerHTML = `<div class="page"><div class="card err">${esc(e.message)}</div></div>`; return; }
  if (stale(seq)) return;
  const cnt = (s) => rows.filter((r) => r.status === s).length;
  const yes = cnt("yes"), partial = cnt("partial"), no = cnt("no"), silent = cnt("not_reported"), total = rows.length || 1;
  const blocks = [...new Map(rows.map((r) => [r.block_id, { id: r.block_id, name: r.block, ta: r.blockTa }])).values()];
  const shown = rows.filter((r) => (state.filterBlock === 0 || r.block_id === state.filterBlock) && (state.filterStatus === "all" || r.status === state.filterStatus));
  const rank = { no: 0, partial: 1, not_reported: 2 };
  const alerts = rows.filter((r) => r.status === "no" || r.status === "partial").sort((a, b) => rank[a.status] - rank[b.status] || (b.at ?? "").localeCompare(a.at ?? ""));
  // Silence is one alert per operator, not one per tank (an operator with 12 tanks would otherwise bury the real issues).
  const silent2 = [...rows.filter((r) => r.status === "not_reported").reduce((m, r) => { const k = `${r.panchayat_id}:${r.operator_id ?? r.id}`; if (!m.has(k)) m.set(k, []); m.get(k).push(r); return m; }, new Map()).values()];
  const dName = rows[0] ? nm2(rows[0].district, rows[0].districtTa) : "";

  let tableRows = "";
  const groups = new Map();
  for (const r of shown) { const k = `${r.block_id}:${r.panchayat_id}`; if (!groups.has(k)) groups.set(k, { r, items: [] }); groups.get(k).items.push(r); }
  for (const { r: g, items } of groups.values()) {
    const bad = items.filter((x) => x.status === "no").length, part = items.filter((x) => x.status === "partial").length;
    const gExt = ext.filter((h) => h.panchayat_id === g.panchayat_id);
    tableRows += `<tr class="grp"><td colspan="5">${esc(nm2(g.panchayat, g.panchayatTa))} <span style="color:var(--muted);font-weight:400">· ${esc(nm2(g.block, g.blockTa))} · ${items.length} ${esc(t("tanks"))} (${esc(kindCount(items))})${bad ? ` · <span style="color:var(--bad)">${bad} ${esc(t("notDelivered").toLowerCase())}</span>` : ""}${part ? ` · <span style="color:var(--warn)">${part} ${esc(t("partialDelivered").toLowerCase())}</span>` : ""}</span>${gExt.length ? `<div style="color:var(--muted);font-weight:400;font-size:13px;margin-top:2px">${gExt.map((h) => `${esc(nm(h))}: ${esc(t("extSupply").replace("{who}", nm2(h.ext, h.extTa)))}`).join(" · ")}</div>` : ""}</td></tr>`;
    tableRows += items.map((r) => `<tr>
      <td>${kindTag(r.kind)} <b>${esc(nm(r))}</b><br><span style="color:var(--muted);font-size:13px">${esc(nm2(r.hab, r.habTa))} · ${esc(fmtCap(r.capacity))}</span><br><span style="color:var(--muted);font-size:13px">${esc(nm2(r.operator, r.operatorTa))}</span>${locLine(r)}</td>
      <td>${statusPill(r.status)}</td>
      <td class="time">${esc(fmtTime(r.at))}</td>
      <td>${r.status === "no" || r.status === "partial" ? `<b>${esc(problemLabel(r.problem))}</b>` : ""}${r.remarks ? `<div style="color:var(--muted)">${esc(r.remarks)}</div>` : ""}${diagSummary(r)}${voiceBtn(r, "t" + r.id)}</td>
      <td>${r.status !== "not_reported" ? reviewPill(r.review_status) : ""}${r.review_note ? `<div style="color:var(--muted);font-size:13px">${esc(r.review_note)}</div>` : ""}</td>
    </tr>`).join("");
  }

  const prefs = state.prefs;
  app.innerHTML = `<div class="page wide">
    ${LIVE ? "" : `<div class="demo-note">${esc(t("demoBanner"))}</div>`}
    <div class="head"><div><h2>${esc(dName)} · ${esc(t("officerTitle"))}</h2><div class="sub">${esc(fmtDate(istToday()))} · ${rows.length} ${esc(t("tanks"))} (${esc(kindCount(rows))})</div></div>${signOutBtn()}</div>
    <div class="tiles">
      <div class="tile yes"><div class="n">${yes}</div><div class="t">${esc(t("delivered"))}</div></div>
      <div class="tile partial"><div class="n">${partial}</div><div class="t">${esc(t("partialDelivered"))}</div></div>
      <div class="tile no"><div class="n">${no}</div><div class="t">${esc(t("notDelivered"))}</div></div>
      <div class="tile silent"><div class="n">${silent}</div><div class="t">${esc(t("notReported"))}</div></div>
    </div>
    <div class="bar"><i class="y" style="width:${yes / total * 100}%"></i><i class="p" style="width:${partial / total * 100}%"></i><i class="n" style="width:${no / total * 100}%"></i><i class="s" style="width:${silent / total * 100}%"></i></div>
    <div class="two">
      <div>
        <div class="section-h"><h3>${esc(t("alerts"))}</h3><span class="label">${alerts.length + silent2.length}</span></div>
        <div class="alerts">${alerts.map((r, i) => `
          <div class="alert ${r.status}"><span class="stripe"></span>
            <div><b>${kindTag(r.kind)} ${esc(nm(r))} <span style="font-weight:400;color:var(--muted)">· ${esc(nm2(r.hab, r.habTa))} · ${esc(nm2(r.panchayat, r.panchayatTa))}</span></b>
              <div class="meta">${r.status === "partial" ? esc(t("partialDelivered")) + " · " : ""}${esc(problemLabel(r.problem))} · ${reviewPill(r.review_status)} · ${esc(nm2(r.operator, r.operatorTa))}</div>
              ${r.remarks ? `<div class="cm">“${esc(r.remarks)}”</div>` : ""}${diagSummary(r)}${locLine(r)}${voiceBtn(r, i)}</div>
            <div class="time">${esc(fmtTime(r.at))}</div>
          </div>`).join("")}${silent2.map((g) => `
          <div class="alert silent"><span class="stripe"></span>
            <div><b>${esc(nm2(g[0].operator, g[0].operatorTa) || "—")} <span style="font-weight:400;color:var(--muted)">· ${esc(nm2(g[0].panchayat, g[0].panchayatTa))} · ${esc(nm2(g[0].block, g[0].blockTa))}</span></b>
              <div class="meta">${esc(t("silentNote"))} · ${g.length === 1 ? esc(kindCount(g)) : `${g.length} ${esc(t("tanks"))} (${esc(kindCount(g))})`}</div>
              <div class="diagline">${g.map((r) => esc(nm(r))).join(" · ")}</div></div>
            <div class="time"></div>
          </div>`).join("")}${alerts.length + silent2.length ? "" : `<div class="card" style="color:var(--muted)">${esc(t("noAlerts"))}</div>`}
        </div>
      </div>
      <div>
        <div class="section-h"><h3>${esc(t("settings"))}</h3></div>
        <div class="card settings">
          <div class="row"><div><div class="h">${esc(t("notifyIn"))}</div><div class="s">${esc(t("alwaysOn"))} · ${esc(t("free"))}</div></div><button class="switch" aria-checked="true" disabled aria-label="In-app"></button></div>
          <div class="row"><div><div class="h">${esc(t("notifyEmail"))}</div><div class="s">${esc(t("free"))}</div></div><button class="switch" data-pref="email" role="switch" aria-checked="${prefs.email}" aria-label="Email"></button></div>
          <div class="row"><div><div class="h">${esc(t("notifyWa"))}</div><div class="s">${esc(t("cheap"))}</div></div><button class="switch" data-pref="wa" role="switch" aria-checked="${prefs.wa}" aria-label="WhatsApp"></button></div>
          <div class="row"><div><div class="h">${esc(t("digest"))}</div><div class="s">${esc(t("free"))}</div></div><button class="switch" data-pref="digest" role="switch" aria-checked="${prefs.digest}" aria-label="Digest"></button></div>
        </div>
        ${places.length || staff.length ? `<div class="section-h" style="margin-top:16px"><h3>${esc(t("staffTitle"))} <span class="label">${staff.length}</span></h3>
          ${places.length && !state.staffForm ? `<button class="link" id="addStaff">${esc(t("addPerson"))}</button>` : ""}</div>
        <p style="margin:-4px 0 8px;color:var(--muted);font-size:13px">${esc(t("staffHint"))}</p>
        ${staffForm(places)}
        <div class="card settings">${staff.length ? staff.map((s) => `<div class="staff-row">
            <div class="h">${esc(nm(s))}</div>
            <div class="s">${esc(t("role_" + s.role))}${s.place ? ` · ${esc(nm2(s.place, s.placeTa))}` : ""} · ${esc(s.phone)} · ${esc(s.devices ? t("devicesIn").replace("{n}", s.devices) : t("noDevice"))}</div>
            <div class="staff-acts">
              ${places.some((p) => p.role === s.role) ? `<button class="link" data-editstaff="${esc(s.phone)}">${esc(t("editPerson"))}</button>` : ""}
              <button class="link" data-resetstaff="${esc(s.phone)}" ${s.devices ? "" : "disabled"}>${esc(t("resetDevices"))}</button>
              <button class="link danger" data-removestaff="${esc(s.phone)}">${esc(t("removePerson"))}</button>
            </div></div>`).join("") : `<div class="staff-row"><div class="s">${esc(t("noStaffYet"))}</div></div>`}</div>` : ""}
      </div>
    </div>
    <div class="card">
      <div class="filters">
        <button data-fb="0" aria-pressed="${state.filterBlock === 0}">${esc(t("all"))}</button>
        ${blocks.map((b) => `<button data-fb="${b.id}" aria-pressed="${state.filterBlock === b.id}">${esc(nm(b))}</button>`).join("")}
        <span style="width:8px"></span>
        <button data-fs="no" aria-pressed="${state.filterStatus === "no"}">${esc(t("notDelivered"))}</button>
        <button data-fs="partial" aria-pressed="${state.filterStatus === "partial"}">${esc(t("partialDelivered"))}</button>
        <button data-fs="not_reported" aria-pressed="${state.filterStatus === "not_reported"}">${esc(t("notReported"))}</button>
      </div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>${esc(t("glr"))} / ${esc(t("operator"))}</th><th>${esc(t("status"))}</th><th>${esc(t("time"))}</th><th>${esc(t("problemCol"))}</th><th>${esc(t("review"))}</th></tr></thead>
        <tbody>${tableRows || `<tr><td colspan="5" style="color:var(--muted)">—</td></tr>`}</tbody>
      </table></div>
    </div>
    ${LIVE ? "" : `<div style="text-align:center"><button class="link" id="resetDemo">${esc(t("reset"))}</button></div>`}
  </div>`;
  bindSignOut(); bindReset();
  app.querySelectorAll("[data-play]").forEach((b) => b.addEventListener("click", async () => {
    const key = b.dataset.play, row = key.startsWith("t") ? rows.find((r) => String(r.id) === key.slice(1)) : alerts[+key];
    const url = row && await data.voiceUrl(row); if (!url) return;
    document.getElementById("audio-" + key).innerHTML = `<audio controls autoplay src="${esc(url)}" style="display:block;width:100%;max-width:320px;margin-top:6px"></audio>`;
  }));
  app.querySelectorAll("[data-fb]").forEach((b) => b.addEventListener("click", () => { state.filterBlock = +b.dataset.fb; render(); }));
  app.querySelectorAll("[data-fs]").forEach((b) => b.addEventListener("click", () => { state.filterStatus = state.filterStatus === b.dataset.fs ? "all" : b.dataset.fs; render(); }));
  app.querySelectorAll("[data-pref]").forEach((b) => b.addEventListener("click", () => { state.prefs[b.dataset.pref] = !state.prefs[b.dataset.pref]; store.set("prefs", state.prefs); render(); }));
  app.querySelectorAll("[data-resetstaff]").forEach((b) => b.addEventListener("click", async () => {
    try { await data.resetStaff(b.dataset.resetstaff); toast(t("devicesReset")); } catch (e) { toast(e.message); }
    render();
  }));
  bindStaffForm(places);
  document.getElementById("addStaff")?.addEventListener("click", () => { state.staffForm = { name: "", phone: "", role: null, place: null }; render(); });
  app.querySelectorAll("[data-editstaff]").forEach((b) => b.addEventListener("click", () => {
    const s = staff.find((x) => x.phone === b.dataset.editstaff);
    state.staffForm = { name: s.name, phone: s.phone, role: s.role, place: s.placeId, edit: true }; render();
  }));
  app.querySelectorAll("[data-removestaff]").forEach((b) => b.addEventListener("click", async () => {
    const s = staff.find((x) => x.phone === b.dataset.removestaff);
    if (!confirm(t("confirmRemove").replace("{name}", nm(s)))) return;
    try { await data.removeStaff(s.phone); toast(t("staffRemoved")); } catch (e) { toast(e.message); }
    render();
  }));
}

// ---------------------------------------------------------------- shell
let toastTimer;
function toast(msg) { const el = document.getElementById("toast"); el.textContent = msg; el.classList.add("on"); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("on"), 2200); }
document.getElementById("langTa").addEventListener("click", () => { state.lang = "ta"; store.set("lang", "ta"); render(); });
document.getElementById("langEn").addEventListener("click", () => { state.lang = "en"; store.set("lang", "en"); render(); });

if (LIVE && ROLE !== "op") {
  // supabase-js holds a lock while this callback runs; a database call inside it waits on that lock forever,
  // so the officer lookup runs just after the callback returns.
  sb.auth.onAuthStateChange((_e, session) => { setTimeout(() => applySession(session), 0); });
  async function applySession(session) {
    let next = null;
    if (session?.user) {
      // select * so an older database without the `active` column still signs people in.
      const { data: me } = await sb.from("officers").select("*").eq("id", session.user.id).maybeSingle();
      next = { email: session.user.email, name: me?.name, phone: me?.phone, panchayat_id: me?.panchayat_id ?? null, role: me?.active === false ? undefined : me?.role };
    }
    if (JSON.stringify(next) !== JSON.stringify(state.officer)) { state.officer = next; store.set("staff_" + ROLE, next); render(); }   // also picks up a role granted after the first sign-in
  }
}

let installEvt = null;
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); installEvt = e; document.getElementById("installBtn").hidden = false; });
document.getElementById("installBtn").addEventListener("click", async () => { if (!installEvt) return; installEvt.prompt(); await installEvt.userChoice; installEvt = null; document.getElementById("installBtn").hidden = true; });
window.addEventListener("appinstalled", () => { document.getElementById("installBtn").hidden = true; });
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register(ROLE === "op" ? "./sw.js" : "../sw.js").catch(() => {});
}

if (!LIVE) seedDemo();
// Opened from the WhatsApp link (…/#join=CODE): sign this phone in, no typing.
const joinCode = ROLE === "op" ? new URLSearchParams(location.hash.slice(1)).get("join") : null;
if (joinCode) {
  history.replaceState(null, "", location.pathname + location.search);   // the code works once; keep it out of the address bar
  openLink(joinCode);
} else { if (state.op) here(); flushQueue(); render(); syncOp(); }

async function openLink(code) {
  app.innerHTML = `<div class="page op"><div class="card wa-card"><h2>${esc(t("opening"))}</h2></div></div>`;
  const res = await data.join(code);
  if (res.error) {
    // Operators often tap the same WhatsApp message every day to open the app: if this phone is already signed in, just open it.
    state.error = state.op ? "" : res.error;
  } else {
    if (!LIVE) { const dev = store.get("devices", {}); dev[res.id] = deviceId(); store.set("devices", dev); }
    state.op = res; state.active = res.glrs.length > 1 ? "all" : 0; state.step = "home"; state.error = "";
    store.set("op", res); store.set("active", state.active);
  }
  if (state.op) here();   // ask "allow location?" now, while the operator is looking, and warm up a fix
  flushQueue(); render();
  if (res.error) syncOp();
}
</script>
