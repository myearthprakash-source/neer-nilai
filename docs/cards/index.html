<!doctype html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neer Nilai Cards</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;700&display=swap">
<style>
:root{--ink:#172420;--muted:#66746E;--line:#D8DFDB;--accent:#1D6FB4;--bg:#F3F6F4}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans","Noto Sans Tamil",system-ui,sans-serif}
.tools{max-width:900px;margin:0 auto;padding:20px 16px;display:flex;flex-direction:column;gap:12px}
.tools h1{font-size:20px;margin:0}
.tools p{margin:0;color:var(--muted);font-size:14px}
textarea{width:100%;min-height:120px;font-family:ui-monospace,monospace;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:10px;box-sizing:border-box}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:10px 16px;font-weight:600;font-size:15px;cursor:pointer}
button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
input{border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:14px;min-width:280px}
.cards{max-width:900px;margin:0 auto;padding:0 16px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:#fff;border:1.5px solid var(--ink);border-radius:14px;padding:16px;display:grid;grid-template-columns:132px 1fr;gap:14px;align-items:center;break-inside:avoid;page-break-inside:avoid}
.card .qr{width:132px;height:132px}
.card .qr img,.card .qr canvas{width:132px!important;height:132px!important;display:block}
.card h2{font-size:18px;margin:0;line-height:1.2}
.card .sub{font-size:13px;color:var(--muted);margin-top:2px}
.card .code{font-family:ui-monospace,monospace;font-size:13px;margin-top:8px}
.card .pin{font-size:22px;font-weight:700;letter-spacing:.2em;margin-top:2px}
.card .how{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.35}
.card .brand{font-size:11px;color:var(--muted);margin-top:6px}
@media print{.tools{display:none}.cards{padding:0;gap:10px}body{background:#fff}}
</style>
</head>
<body>
<div class="tools">
  <h1>Neer Nilai · GLR operator cards</h1>
  <p>One card per tank. Print, cut, and hand to the operator. Scanning the QR sets the phone up with no typing. Paste rows as <b>code, name, habitation, PIN</b> (one per line), then Generate.</p>
  <textarea id="csv">NLG-UDH-KKL-01, ஜீவநகர் தொட்டி, ஜீவநகர், 1234
NLG-UDH-KKL-02, கூக்கல் மெயின் தொட்டி, கூக்கல் மெயின், 1234
NLG-UDH-KKL-03, கூக்கல் காலனி தொட்டி, கூக்கல் மெயின், 1234</textarea>
  <div class="row">
    <label for="base" style="font-size:14px">App link</label><input id="base" value="">
    <button id="gen">Generate</button><button class="ghost" onclick="window.print()">Print</button>
  </div>
</div>
<div class="cards" id="cards"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const baseEl = document.getElementById("base");
baseEl.value = location.href.replace(/cards\/?(index\.html)?(\?.*)?$/, "");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function gen() {
  const base = baseEl.value.trim().replace(/\/?$/, "/");
  const rows = document.getElementById("csv").value.split(/\n/).map((l) => l.split(",").map((x) => x.trim())).filter((r) => r[0]);
  const wrap = document.getElementById("cards"); wrap.innerHTML = "";
  rows.forEach(([code, name, hab, pin], i) => {
    const url = `${base}?g=${encodeURIComponent(code)}&k=${encodeURIComponent(pin || "")}`;
    const el = document.createElement("div"); el.className = "card";
    el.innerHTML = `<div class="qr" id="qr${i}"></div><div>
      <h2>${esc(name || code)}</h2><div class="sub">${esc(hab || "")}</div>
      <div class="code">${esc(code)}</div><div class="pin">${esc(pin || "")}</div>
      <div class="how">1. QR-ஐ ஸ்கேன் செய்யவும்<br>2. தினமும் தண்ணீர் வந்ததா என்று தொடவும்</div>
      <div class="brand">நீர் நிலை · Neer Nilai</div></div>`;
    wrap.appendChild(el);
    new QRCode(document.getElementById("qr" + i), { text: url, width: 132, height: 132, correctLevel: QRCode.CorrectLevel.M });
  });
}
document.getElementById("gen").addEventListener("click", gen);
gen();
</script>
</body>
</html>
