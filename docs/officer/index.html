<!doctype html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D6FB4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Neer Nilai Officer">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<title>Neer Nilai Officer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+Tamil:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F3F6F4; --surface:#FFFFFF; --ink:#172420; --muted:#66746E; --line:#D8DFDB; --soft:#EAF0EC;
  --accent:#1D6FB4; --accent-ink:#FFFFFF; --accent-soft:#E2EEF8;
  --good:#1C8A5A; --good-bg:#E1F3E9; --bad:#C2432D; --bad-bg:#FBE7E2; --warn:#A96F12; --warn-bg:#FBF0D9;
  --shadow:0 1px 2px rgba(23,36,32,.06),0 8px 24px rgba(23,36,32,.06);
  --sans:"IBM Plex Sans","Noto Sans Tamil",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1614; --surface:#182220; --ink:#E6ECE8; --muted:#93A19A; --line:#2A3733; --soft:#1F2B27;
    --accent:#5AA3E0; --accent-ink:#0B1A28; --accent-soft:#1B2E3D;
    --good:#4CC08A; --good-bg:#143427; --bad:#F07A63; --bad-bg:#3F1F19; --warn:#E0A64A; --warn-bg:#3A2B12;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1614; --surface:#182220; --ink:#E6ECE8; --muted:#93A19A; --line:#2A3733; --soft:#1F2B27;
  --accent:#5AA3E0; --accent-ink:#0B1A28; --accent-soft:#1B2E3D;
  --good:#4CC08A; --good-bg:#143427; --bad:#F07A63; --bad-bg:#3F1F19; --warn:#E0A64A; --warn-bg:#3A2B12;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.qh{font-weight:600;margin-bottom:6px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:960px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em}
.brand .drop{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--accent);display:inline-block}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px;letter-spacing:0}
.spacer{flex:1}
.install{border:1.5px solid var(--accent);color:var(--accent);background:transparent;border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--bg);gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-weight:500;color:var(--muted);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

.page{max-width:480px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:16px}
.page.wide{max-width:960px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.demo-note{font-size:13px;color:var(--muted);background:var(--soft);border-radius:8px;padding:8px 12px}
.err{color:var(--bad);font-size:14px;margin-top:8px}
.info{color:var(--good);font-size:14px;margin-top:8px}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:0;font-size:14px}
.field{display:flex;flex-direction:column;gap:6px;margin-top:14px}
textarea,input,select{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--surface);font-size:16px}
textarea{min-height:76px;resize:vertical}
.btn{border:0;border-radius:12px;padding:15px 18px;font-size:18px;font-weight:700;width:100%;background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.yes{background:var(--good-bg);color:var(--good)} .pill.partial{background:var(--warn-bg);color:var(--warn)} .pill.no{background:var(--bad-bg);color:var(--bad)} .pill.silent{background:var(--soft);color:var(--muted)}
.pill.pending{background:var(--soft);color:var(--muted)} .pill.confirmed{background:var(--accent-soft);color:var(--accent)} .pill.flagged{background:var(--bad-bg);color:var(--bad)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1}

/* operator */
.glrs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.glrs button{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px}
.glrs button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.glrs i{width:9px;height:9px;border-radius:50%;background:var(--line);display:inline-block}
.glrs i.yes{background:var(--good)} .glrs i.partial{background:var(--warn)} .glrs i.no{background:var(--bad)}
.place h2{font-size:22px;font-weight:700}
.place .sub{color:var(--muted);font-size:14px;margin-top:2px}
.flow{margin-top:12px;background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.5}
.flow b{color:var(--accent)}
.date{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.date .d{font-weight:600}
.q{font-size:22px;font-weight:700;margin-bottom:14px}
.yn{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.yn button{min-width:0;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:16px 4px 14px;font-size:20px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .08s ease}
.yn small{font-size:12px;font-weight:500;color:var(--muted);line-height:1.2;text-align:center}
.yn button:active{transform:scale(.97)}
.yn .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:2px solid currentColor;font-size:22px}
.yn .yes{color:var(--good)} .yn .partial{color:var(--warn)} .yn .no{color:var(--bad)}
.yn .yes[aria-pressed="true"]{background:var(--good-bg);border-color:var(--good)}
.yn .partial[aria-pressed="true"]{background:var(--warn-bg);border-color:var(--warn)}
.yn .no[aria-pressed="true"]{background:var(--bad-bg);border-color:var(--bad)}
.problem{margin-top:16px;border-left:4px solid var(--warn);background:var(--warn-bg);border-radius:0 12px 12px 0;padding:14px 14px 16px}
.problem h3{font-size:17px;font-weight:700}
.problem .hint{color:var(--muted);font-size:13px;margin:4px 0 0}
.diag{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.diag button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 4px;font-size:14px;font-weight:500}
.diag button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;font-size:15px;font-weight:500}
.chips button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.saved{display:flex;gap:14px;align-items:flex-start}
.saved .mark{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:700;flex:none}
.saved.yes .mark{background:var(--good-bg);color:var(--good)} .saved.partial .mark{background:var(--warn-bg);color:var(--warn)} .saved.no .mark{background:var(--bad-bg);color:var(--bad)}
.saved h3{font-size:18px}
.saved p{margin:4px 0 0;color:var(--muted);font-size:14px}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.strip div{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.strip i{display:block;width:100%;height:10px;border-radius:4px;background:var(--line)}
.strip i.yes{background:var(--good)} .strip i.partial{background:var(--warn)} .strip i.no{background:var(--bad)}
.setup-row{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}

/* review + officer */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head h2{font-size:24px;font-weight:700}
.head .sub{color:var(--muted);font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:520px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;border-top:4px solid var(--line)}
.tile .n{font-size:34px;font-weight:600;line-height:1;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tile .t{font-size:13px;color:var(--muted);margin-top:6px}
.tile.yes{border-top-color:var(--good)} .tile.partial{border-top-color:var(--warn)} .tile.no{border-top-color:var(--bad)} .tile.silent{border-top-color:var(--muted)}
.bar{height:8px;border-radius:4px;overflow:hidden;display:flex;background:var(--line)}
.bar i{display:block;height:100%}
.bar .y{background:var(--good)} .bar .p{background:var(--warn)} .bar .n{background:var(--bad)} .bar .s{background:var(--muted)}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
.section-h h3{font-size:16px;font-weight:700}
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:grid;grid-template-columns:4px 1fr auto;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px 0;overflow:hidden}
.alert .stripe{background:var(--bad);border-radius:0 2px 2px 0}
.alert.partial .stripe{background:var(--warn)}
.alert.silent .stripe{background:var(--muted)}
.alert b{display:block;font-weight:600}
.alert .meta{color:var(--muted);font-size:13px}
.alert .cm{font-size:14px;margin-top:4px}
.alert .time{font-size:13px;color:var(--muted);white-space:nowrap;padding-right:14px}
.diagline{font-size:12px;color:var(--muted);margin-top:4px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.filters button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:500}
.filters button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.time{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted)}
.grp{font-weight:600;background:var(--soft)}
.grp td{padding:8px 10px}
.settings{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row .h{font-weight:500}
.row .s{font-size:13px;color:var(--muted)}
.switch{width:44px;height:26px;border-radius:999px;border:0;background:var(--line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:left .15s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{left:21px}
.two{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:760px){.two{grid-template-columns:1.1fr .9fr}}
.rv{display:flex;flex-direction:column;gap:10px}
.rv-item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.rv-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.rv-top b{font-weight:600}
.rv-top .sub{color:var(--muted);font-size:13px}
.rv-body{font-size:14px;margin-top:6px}
.rv-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.rv-actions button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px}
.rv-actions .ok{border-color:var(--accent);color:var(--accent)}
.rv-actions .flag{border-color:var(--bad);color:var(--bad)}
.rv-actions input{flex:1;min-width:140px;padding:8px 10px;font-size:14px}
.credit{max-width:960px;margin:0 auto;padding:8px 16px 28px;text-align:center;font-size:12px;color:var(--muted);letter-spacing:.02em}
.credit b{font-weight:600;color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="top"><div class="top-in">
  <div class="brand"><span class="drop"></span><div>Neer Nilai<small id="brandSub">நீர் நிலை</small></div></div>
  <div class="spacer"></div>
  <button class="install" id="installBtn" hidden>Install app</button>
  <div class="seg" role="group" aria-label="Language">
    <button id="langTa" aria-pressed="true">தமிழ்</button>
    <button id="langEn" aria-pressed="false">EN</button>
  </div>
</div></div>

<main id="app"></main>
<footer class="credit">Made by <b>Catalyx Technology</b></footer>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

// ---------------------------------------------------------------- i18n
const T = {

function seedDemo() {

  const at = (h, m) => { const d = new Date(); d.setHours(h, m, 0, 0); return d.toISOString(); };
  const today = istToday(), rows = [];
  const R = (glr_id, date, status, extra, hh, mm, review) => rows.push({ glr_id, date, status, source_ok: null, pump_ok: null, glr_filled: null, problem: null, remarks: "", ...extra, at: at(hh, mm),
    review_status: review?.[0] ?? "pending", review_note: review?.[1] ?? "", reviewed_at: review ? at(hh + 1, 0) : null });
  // History for Jeevanagar (GLR 1), last 6 days.
  ["yes", "yes", "no", "partial", "yes", "yes"].forEach((v, i) => R(1, dayOffset(-6 + i), v,
    v === "no" ? { source_ok: "yes", pump_ok: "no", glr_filled: "no", problem: "power", remarks: "EB line fault, restored next day" }
    : v === "partial" ? { source_ok: "no", pump_ok: "yes", glr_filled: "no", problem: "source", remarks: "" } : {}, 8, 30, ["confirmed", ""]));
  // Today. Jeevanagar (GLR 1) has not reported yet.
  R(2, today, "yes", {}, 7, 55, ["confirmed", ""]);
  R(3, today, "no", { source_ok: "yes", pump_ok: "no", glr_filled: "no", problem: "pump", remarks: "Motor burnt, electrician informed 8:00 AM" }, 8, 10);
  R(4, today, "yes", {}, 8, 42);
  R(5, today, "partial", { source_ok: "no", pump_ok: "unknown", glr_filled: "no", problem: "source", remarks: "Stream flow low, only 40 minutes supply" }, 8, 25, ["confirmed", "Verified with ward member"]);
  R(6, today, "no", { source_ok: "yes", pump_ok: "yes", glr_filled: "yes", problem: "pipe_dist", remarks: "பிரதான வால்வு அருகில் குழாய் உடைந்தது, பழுது பார்க்க ஆள் வந்துள்ளார்" }, 9, 5, ["flagged", "GLR was full; check valve operator attendance"]);
  R(7, today, "yes", {}, 8, 0);
  store.set(RK, rows);
}

// ---------------------------------------------------------------- data layer (demo | live)
const data = {
  async login(code, pin) {
    if (LIVE) {
      const { data: rows, error } = await sb.rpc("operator_login", { p_code: code, p_pin: pin });
      if (error || !rows?.length) return null;
      const r = rows[0];
      return { id: r.id, code: r.code, pin, name: r.name, ta: r.name_ta, scheme: r.scheme, supply: r.supply_window, hab: r.habitation, habTa: r.habitation_ta,
        panchayat_id: r.panchayat_id, panchayat: r.panchayat, panchayatTa: r.panchayat_ta, block_id: r.block_id, block: r.block, blockTa: r.block_ta, district: r.district, districtTa: r.district_ta };
    }
    const g = DEMO.glrs.find((x) => x.code === code.trim().toUpperCase());
    if (!g || pin !== "1234") return null;
    return { ...glrInfo(g), pin };
  },
  async history(place) {
    if (LIVE) {
      const { data: rows } = await sb.rpc("operator_history", { p_code: place.code, p_pin: place.pin });
      return (rows ?? []).map((r) => ({ date: r.report_date, status: r.status, problem: r.problem, remarks: r.remarks, at: r.reported_at, source_ok: r.source_ok, pump_ok: r.pump_ok, glr_filled: r.glr_filled }));
    }
    return store.get(RK, []).filter((r) => r.glr_id === place.id);
  },
  async submit(place, d) {
    if (LIVE) {
      if (!navigator.onLine) { queue(place, d); return { queued: true }; }
      const { error } = await sb.rpc("submit_report", { p_code: place.code, p_pin: place.pin, p_status: d.status, p_source_ok: d.source_ok, p_pump_ok: d.pump_ok, p_glr_filled: d.glr_filled, p_problem: d.problem, p_remarks: d.remarks, p_device: deviceId() });
      if (error) throw error;
      return { ok: true };
    }
    const rows = store.get(RK, []).filter((r) => !(r.glr_id === place.id && r.date === istToday()));
    const yes = d.status === "yes";
    rows.push({ glr_id: place.id, date: istToday(), status: d.status, source_ok: yes ? null : d.source_ok, pump_ok: yes ? null : d.pump_ok, glr_filled: yes ? null : d.glr_filled,
      problem: yes ? null : d.problem, remarks: d.remarks, at: nowIso(), review_status: "pending", review_note: "", reviewed_at: null });
    store.set(RK, rows);
    return { ok: true };
  },
  async today() {
    if (LIVE) {
      const { data: rows, error } = await sb.from("v_today").select("*");
      if (error) throw error;
      return rows.map((r) => ({ id: r.glr_id, code: r.code, name: r.glr, ta: r.glr_ta, hab: r.habitation, habTa: r.habitation_ta, panchayat_id: r.panchayat_id, panchayat: r.panchayat, panchayatTa: r.panchayat_ta,
        block_id: r.block_id, block: r.block, blockTa: r.block_ta, district: r.district, districtTa: r.district_ta, report_id: r.report_id, status: r.status,
        source_ok: r.source_ok, pump_ok: r.pump_ok, glr_filled: r.glr_filled, problem: r.problem, remarks: r.remarks, at: r.reported_at, review_status: r.review_status ?? "pending", review_note: r.review_note ?? "" }));
    }
    const rows = store.get(RK, []);
    return DEMO.glrs.map((g) => {
      const info = glrInfo(g);
      const r = rows.find((x) => x.glr_id === g.id && x.date === istToday());
      return { ...info, report_id: r ? g.id : null, status: r ? r.status : "not_reported", source_ok: r?.source_ok ?? null, pump_ok: r?.pump_ok ?? null, glr_filled: r?.glr_filled ?? null,
        problem: r?.problem ?? null, remarks: r?.remarks ?? "", at: r?.at ?? null, review_status: r?.review_status ?? "pending", review_note: r?.review_note ?? "" };
    });
  },
  async review(row, status, note) {
    if (LIVE) {
      const { error } = await sb.rpc("review_report", { p_report_id: row.report_id, p_status: status, p_note: note });
      if (error) throw error; return;
    }
    const rows = store.get(RK, []);
    const r = rows.find((x) => x.glr_id === row.id && x.date === istToday());
    if (r) { r.review_status = status; r.review_note = note; r.reviewed_at = nowIso(); store.set(RK, rows); }
  },
};
function deviceId() { let id = store.get("device", null); if (!id) { id = Math.random().toString(36).slice(2, 10); store.set("device", id); } return id; }
function queue(place, d) { const q = store.get("queue", []); q.push({ place, d, at: nowIso() }); store.set("queue", q); }
async function flushQueue() {
  const q = store.get("queue", []); if (!q.length || !LIVE || !navigator.onLine) return;
  const rest = [];
  for (const item of q) { try { await data.submit(item.place, item.d); } catch { rest.push(item); } }
  store.set("queue", rest);
  if (rest.length < q.length) toast(t("saved"));
}

  else if (!state.officer) renderStaffLogin();
  else if (ROLE === "rv") renderReview();
  else renderOfficer();
}

// ---------------------------------------------------------------- operator (GLR level)

  app.innerHTML = `<div class="page">
    ${LIVE ? "" : `<div class="demo-note">${esc(t("demoBanner"))}</div>`}
    <div class="card">
      <h2 style="font-size:20px;font-weight:700">${esc(t("setupTitle"))}</h2>

      <div class="field"><label class="label" for="pin">${esc(t("pin"))}</label><input id="pin" inputmode="numeric" maxlength="4" placeholder="••••" type="password"></div>

    </div>
  </div>`;
  document.getElementById("loginBtn").addEventListener("click", async () => {

async function renderOperator() {
  if (!state.places.length || state.adding) return renderSetup();
  if (state.active >= state.places.length) state.active = 0;
  const place = state.places[state.active];
  const hist = await data.history(place);
  const todayRow = hist.find((r) => r.date === istToday());
  const d = state.draft;
  const days = Array.from({ length: 7 }, (_, i) => dayOffset(i - 6));
  const strip = days.map((day) => {
    const r = hist.find((x) => x.date === day);
    const short = new Date(day + "T00:00:00").toLocaleDateString(state.lang === "ta" ? "ta-IN" : "en-IN", { weekday: "narrow" });
    return `<div><i class="${r ? r.status : ""}"></i>${esc(short)}</div>`;
  }).join("");

  // GLR switcher: one operator may look after several GLRs in a habitation.
  const all = LIVE ? [] : store.get(RK, []);
  const tabs = `<div class="glrs">${state.places.map((p, i) => {
    const r = all.find((x) => x.glr_id === p.id && x.date === istToday());
    return `<button data-glr="${i}" aria-pressed="${i === state.active}"><i class="${r ? r.status : ""}"></i>${esc(nm(p))}</button>`;
  }).join("")}<button data-add="1">${esc(t("addGlr"))}</button></div>`;

  let body;
  if (todayRow && !state.editing) {
    body = `
      <div class="card saved ${todayRow.status}">
        <div class="mark">${{ yes: "✓", partial: "◐", no: "✕" }[todayRow.status]}</div>
        <div style="flex:1;min-width:0">
          <h3>${esc(t("saved"))}</h3>
          <p>${esc(t(todayRow.status === "yes" ? "savedYes" : todayRow.status === "partial" ? "savedPartial" : "savedNo"))}</p>
          ${todayRow.status !== "yes" ? `<p><b>${esc(t("qProblem"))}</b> ${esc(problemLabel(todayRow.problem))}</p>${diagSummary(todayRow)}` : ""}
          ${todayRow.remarks ? `<p>“${esc(todayRow.remarks)}”</p>` : ""}
          ${todayRow.at ? `<p class="mono">${esc(t("reportedAt"))} ${esc(fmtTime(todayRow.at))}</p>` : ""}
          <p style="margin-top:10px"><button class="link" id="editBtn">${esc(t("change"))}</button></p>
        </div>
      </div>`;
  } else {
    const issue = d.status === "partial" || d.status === "no";
    const canSave = d.status === "yes" || (issue && d.problem);
    body = `
      <div class="card">
        <div class="q">${esc(t("q"))}</div>
        <div class="yn">
          <button class="yes" id="yesBtn" aria-pressed="${d.status === "yes"}"><span class="ic">✓</span>${esc(t("yes"))}<small>${esc(t("yesSub"))}</small></button>
          <button class="partial" id="partialBtn" aria-pressed="${d.status === "partial"}"><span class="ic">◐</span>${esc(t("partial"))}<small>${esc(t("partialSub"))}</small></button>
          <button class="no" id="noBtn" aria-pressed="${d.status === "no"}"><span class="ic">✕</span>${esc(t("no"))}<small>${esc(t("noSub"))}</small></button>
        </div>
        <div class="problem" ${issue ? "" : "hidden"}>
          <h3>${esc(t("problemTitle"))}</h3>
          <p class="hint">${esc(t("problemHint"))}</p>
          ${DIAG.map(([k, q]) => `<div class="field"><div class="qh">${esc(t(q))}</div>
            <div class="diag">${["yes", "no", "unknown"].map((v) => `<button data-diag="${k}" data-v="${v}" aria-pressed="${d[k] === v}">${esc(dLabel(v))}</button>`).join("")}</div></div>`).join("")}
          <div class="field"><div class="qh">${esc(t("qProblem"))}</div>
            <div class="chips">${PROBLEMS.map((r) => `<button data-problem="${r.code}" aria-pressed="${d.problem === r.code}">${esc(state.lang === "ta" ? r.ta : r.en)}</button>`).join("")}</div></div>
          <div class="field"><label class="qh" for="remarks">${esc(t("remarks"))}</label><textarea id="remarks" placeholder="${esc(t("remarksPh"))}">${esc(d.remarks)}</textarea></div>
        </div>
        <div class="field" ${d.status === "yes" ? "" : "hidden"}><label class="label" for="remarksYes">${esc(t("comment"))}</label><textarea id="remarksYes">${esc(d.remarks)}</textarea></div>
        ${state.error ? `<div class="err">${esc(state.error)}</div>` : ""}
        <div style="margin-top:16px"><button class="btn" id="saveBtn" ${canSave && !state.busy ? "" : "disabled"}>${esc(state.busy ? t("saving") : t("save"))}</button></div>
        ${!navigator.onLine ? `<div class="err" style="color:var(--warn)">${esc(t("offline"))}</div>` : ""}
      </div>`;
  }

  app.innerHTML = `<div class="page">
    ${LIVE ? "" : `<div class="demo-note">${esc(t("demoBanner"))}</div>`}
    ${tabs}
    <div class="card place">
      <div class="setup-row"><div style="min-width:0">
        <h2>${esc(nm(place))}</h2>
        <div class="sub">${esc(nm2(place.hab, place.habTa))} ${esc(t("habitation"))} · ${esc(nm2(place.panchayat, place.panchayatTa))} ${esc(t("panchayat"))}</div>
        <div class="sub">${esc(nm2(place.block, place.blockTa))} ${esc(t("block"))} · ${esc(nm2(place.district, place.districtTa))} ${esc(t("district"))}</div>
      </div><span class="mono" style="font-size:12px;color:var(--muted);white-space:nowrap">${esc(place.code)}</span></div>
      ${place.scheme ? `<div class="flow"><b>${esc(t("scheme"))}:</b> ${esc(place.scheme)}${place.supply ? `<br><b>${esc(t("supplyTime"))}:</b> ${esc(place.supply)}` : ""}</div>` : ""}
      <div class="date"><span class="label">${esc(t("today"))}</span><span class="d">${esc(fmtDate(istToday()))}</span></div>
    </div>
    ${body}
    <div class="card"><span class="label">${esc(t("last7"))}</span><div class="strip">${strip}</div></div>
    <div style="text-align:center"><button class="link" id="removeGlr">${esc(t("removeGlr"))}</button></div>
  </div>`;

  app.querySelectorAll("[data-glr]").forEach((b) => b.addEventListener("click", () => { state.active = +b.dataset.glr; store.set("active", state.active); state.editing = false; state.draft = emptyDraft(); render(); }));
  app.querySelector("[data-add]")?.addEventListener("click", () => { state.adding = true; state.error = ""; render(); });
  document.getElementById("editBtn")?.addEventListener("click", () => {
    state.editing = true; state.draft = { status: todayRow.status, source_ok: todayRow.source_ok, pump_ok: todayRow.pump_ok, glr_filled: todayRow.glr_filled, problem: todayRow.problem, remarks: todayRow.remarks ?? "" }; render();
  });
  document.getElementById("yesBtn")?.addEventListener("click", () => { state.draft.status = "yes"; state.error = ""; render(); });
  document.getElementById("partialBtn")?.addEventListener("click", () => { state.draft.status = "partial"; state.error = ""; render(); });
  document.getElementById("noBtn")?.addEventListener("click", () => { state.draft.status = "no"; state.error = ""; render(); });
  app.querySelectorAll("[data-diag]").forEach((b) => b.addEventListener("click", () => { const k = b.dataset.diag; state.draft[k] = state.draft[k] === b.dataset.v ? null : b.dataset.v; render(); }));
  app.querySelectorAll("[data-problem]").forEach((b) => b.addEventListener("click", () => { state.draft.problem = b.dataset.problem; render(); }));
  document.getElementById("remarks")?.addEventListener("input", (e) => { state.draft.remarks = e.target.value; });
  document.getElementById("remarksYes")?.addEventListener("input", (e) => { state.draft.remarks = e.target.value; });
  document.getElementById("saveBtn")?.addEventListener("click", saveReport);
  document.getElementById("removeGlr")?.addEventListener("click", () => {
    state.places = state.places.filter((_, i) => i !== state.active); state.active = 0; store.set("places", state.places); store.set("active", 0); state.editing = false; state.draft = emptyDraft(); render();
  });
}

async function saveReport() {
  const d = state.draft, place = state.places[state.active];
  if (d.status !== "yes" && !d.problem) { state.error = t("pickProblem"); return render(); }
  state.busy = true; state.error = ""; render();
  try {
    const res = await data.submit(place, d);
    state.editing = false; state.draft = emptyDraft();
    toast(res.queued ? t("offline") : t("saved"));
  } catch (e) { state.error = e.message || String(e); }
  state.busy = false; render();
}

  const pname = mine[0] ? nm2(mine[0].panchayat, mine[0].panchayatTa) : "";
  const rank = { no: 0, partial: 1, not_reported: 2, yes: 3 };
  const list = [...mine].sort((a, b) => rank[a.status] - rank[b.status] || (a.review_status === "pending" ? -1 : 1));

          <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">${statusPill(r.status)}${r.status !== "not_reported" ? reviewPill(r.review_status) : ""}</div></div>
        ${r.status === "not_reported" ? `<div class="rv-body" style="color:var(--muted)">${esc(t("silentNote"))}</div>` : r.status === "yes" ? (r.remarks ? `<div class="rv-body">${esc(r.remarks)}</div>` : "") : `

        ${r.review_note ? `<div class="rv-body" style="color:var(--muted)">${esc(t("review"))}: ${esc(r.review_note)}</div>` : ""}
        ${r.status !== "not_reported" ? `<div class="rv-actions">
          <input id="note-${i}" placeholder="${esc(t("notePh"))}" value="${esc(r.review_note)}">
          <button class="ok" data-rv="${i}" data-s="confirmed">${esc(t("confirm"))}</button>

        </div>` : ""}
      </div>`).join("") : `<div class="card" style="color:var(--muted)">${esc(t("nothingToReview"))}</div>`}
    </div>
    ${LIVE ? "" : `<div style="text-align:center"><button class="link" id="resetDemo">${esc(t("reset"))}</button></div>`}

  bindSignOut(); bindReset();
  app.querySelectorAll("[data-rv]").forEach((b) => b.addEventListener("click", async () => {

      </div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>${esc(t("glr"))}</th><th>${esc(t("status"))}</th><th>${esc(t("time"))}</th><th>${esc(t("problemCol"))}</th><th>${esc(t("review"))}</th></tr></thead>
        <tbody>${tableRows || `<tr><td colspan="5" style="color:var(--muted)">—</td></tr>`}</tbody>
      </table></div>
    </div>
    ${LIVE ? "" : `<div style="text-align:center"><button class="link" id="resetDemo">${esc(t("reset"))}</button></div>`}
  </div>`;
  bindSignOut(); bindReset();
  app.querySelectorAll("[data-fb]").forEach((b) => b.addEventListener("click", () => { state.filterBlock = +b.dataset.fb; render(); }));
  app.querySelectorAll("[data-fs]").forEach((b) => b.addEventListener("click", () => { state.filterStatus = state.filterStatus === b.dataset.fs ? "all" : b.dataset.fs; render(); }));
  app.querySelectorAll("[data-pref]").forEach((b) => b.addEventListener("click", () => { state.prefs[b.dataset.pref] = !state.prefs[b.dataset.pref]; store.set("prefs", state.prefs); render(); }));
}

// ---------------------------------------------------------------- shell
let toastTimer;
function toast(msg) { const el = document.getElementById("toast"); el.textContent = msg; el.classList.add("on"); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("on"), 2200); }
document.getElementById("langTa").addEventListener("click", () => { state.lang = "ta"; store.set("lang", "ta"); render(); });
document.getElementById("langEn").addEventListener("click", () => { state.lang = "en"; store.set("lang", "en"); render(); });

if (LIVE && ROLE !== "op") {
  sb.auth.onAuthStateChange(async (_e, session) => {
    let next = null;
    if (session?.user) {
      const { data: me } = await sb.from("officers").select("panchayat_id, role").eq("id", session.user.id).maybeSingle();
      next = { email: session.user.email, panchayat_id: me?.panchayat_id ?? null, role: me?.role };
    }
    if ((next?.email ?? null) !== (state.officer?.email ?? null)) { state.officer = next; store.set("officer_" + ROLE, next); render(); }
  });
}

// Install prompt (Android Chrome shows "Install app" once the site has a manifest + service worker).
let installEvt = null;
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); installEvt = e; document.getElementById("installBtn").hidden = false; });
document.getElementById("installBtn").addEventListener("click", async () => { if (!installEvt) return; installEvt.prompt(); await installEvt.userChoice; installEvt = null; document.getElementById("installBtn").hidden = true; });
window.addEventListener("appinstalled", () => { document.getElementById("installBtn").hidden = true; });
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register(ROLE === "op" ? "./sw.js" : "../sw.js").catch(() => {});
}

if (!LIVE) seedDemo();
flushQueue();
render();
</script>

</head>
</html>
